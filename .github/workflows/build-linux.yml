name: Build ROBOTDOLLY Linux server

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Linux amd64 Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout Madders darkride-builds
        uses: actions/checkout@v4
        with:
          repository: Madders/darkride-interface
          ref: darkride-builds

      - name: Record source revision
        run: git rev-parse HEAD

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish experimental image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/judasshuffle/robotdolly-darkride-server:madders-test
          provenance: false
